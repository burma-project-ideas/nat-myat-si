<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NatMyatSi — နတ်မျက်စိ</title>
    <meta name="description" content="A private, bilingual NatMyatSi reflection experience with local static data. မေးခွန်းရွေး၍ စဉ်းစားဆင်ခြင်နိုင်သော နတ်မျက်စိ အက်ပ်။" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preload" href="fonts/Padauk-Myanmar-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/Padauk-Myanmar-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <script type="importmap"></script>
    <link rel="stylesheet" href="css/tailwind.css?v=bencho1" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#080808" />
    <meta property="og:image" content="https://nat-myat-si.vercel.app/branding/social.png" />
    <meta property="og:title" content="Nat Myat Si" />
    <meta property="og:url" content="https://nat-myat-si.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://nat-myat-si.vercel.app/branding/social.png" />
</head>

<body>
    <div id="app">
        <img src="logo.svg" alt="" width="64" height="64" style="display:block;margin:18vh auto 20px" />
        <div class="loading-progress-text" role="status" aria-live="polite"></div>
    </div>

    <div id="blazor-error-ui" role="alert">
        <span lang="en">The app encountered an error.</span>
        <span lang="my">အက်ပ်တွင် အမှားတစ်ခု ဖြစ်ပေါ်ခဲ့သည်။</span>
        <a href="." class="reload">Reload / ပြန်ဖွင့်မည်</a>
        <button type="button" class="dismiss" aria-label="Dismiss error / အမှားစာကို ပိတ်မည်">×</button>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
